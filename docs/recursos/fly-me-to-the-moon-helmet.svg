<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 100 100" role="img" aria-label="Logo: casco de astronauta con la Luna reflejada en el visor">
  <title>Fly Me to the Moon</title>
  <desc>Astronaut helmet with the Moon reflected in its visor; a thin gold crescent on the Moon's lower limb is sunlight grazing the south pole. Designed with Claude Code (SI) for the Fly Me to the Moon team.</desc>
  <defs>
    <symbol id="m7" viewBox="0 0 100 100">
      <!-- Neck ring -->
      <path d="M30 74 H70 L73 88 Q73 91 70 91 H30 Q27 91 27 88 Z" fill="#f4f6f8" stroke="#05070a" stroke-opacity="0.22" stroke-width="1" />
      <rect x="28.2" y="83" width="43.6" height="2.2" fill="#05070a" opacity="0.45" />
      <!-- Shell -->
      <circle cx="50" cy="46" r="36" fill="#f4f6f8" stroke="#05070a" stroke-opacity="0.22" stroke-width="1" />
      <!-- Side lamp -->
      <rect x="11" y="40" width="5" height="12" rx="2" fill="#05070a" opacity="0.35" />
      <rect x="84" y="40" width="5" height="12" rx="2" fill="#05070a" opacity="0.35" />
      <!-- Visor -->
      <clipPath id="m7-visor">
        <path d="M22 44 C22 28 34 20 50 20 C66 20 78 28 78 44 C78 60 66 68 50 68 C34 68 22 60 22 44 Z" />
      </clipPath>
      <path d="M22 44 C22 28 34 20 50 20 C66 20 78 28 78 44 C78 60 66 68 50 68 C34 68 22 60 22 44 Z" fill="#05070a" />
      <g clip-path="url(#m7-visor)">
        <!-- Stars -->
        <circle cx="31" cy="34" r="0.9" fill="#f4f6f8" opacity="0.7" />
        <circle cx="38" cy="27" r="0.6" fill="#f4f6f8" opacity="0.6" />
        <circle cx="29" cy="47" r="0.6" fill="#f4f6f8" opacity="0.5" />
        <!-- The Moon in the visor, with the gold crescent of grazing sunlight on its lower limb -->
        <clipPath id="m7-moon"><circle cx="56" cy="42" r="13" /></clipPath>
        <circle cx="56" cy="42" r="13" fill="#c9ced6" />
        <g clip-path="url(#m7-moon)">
          <circle cx="51" cy="38" r="3" fill="#9aa1ab" />
          <circle cx="61" cy="36" r="2" fill="#9aa1ab" />
          <circle cx="58" cy="46" r="2.4" fill="#9aa1ab" />
          <path d="M43 42 A13 13 0 0 0 69 42 A13 11.6 0 0 1 43 42 Z" fill="#f2b705" />
        </g>
        <!-- Reflection sweep across the visor -->
        <path d="M27 38 C29 28 37 23 46 22" fill="none" stroke="#f4f6f8" stroke-width="2.4" stroke-linecap="round" opacity="0.55" />
      </g>
      <!-- Thin visor rim -->
      <path d="M22 44 C22 28 34 20 50 20 C66 20 78 28 78 44 C78 60 66 68 50 68 C34 68 22 60 22 44 Z" fill="none" stroke="#05070a" stroke-width="1.6" opacity="0.6" />
    </symbol>
  </defs>
  <use href="#m7" />
</svg>
